name: Build preview iOS

# Manual only. Builds the `preview` profile for iOS and uploads it to
# TestFlight. Use this when a change needs a new binary — a new native module,
# or a bump to VERSION — rather than an OTA update.
on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS preview
    type: build
    params:
      platform: ios
      profile: preview

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: preview
